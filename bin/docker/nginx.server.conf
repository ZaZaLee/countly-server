server {
    listen 8080;
    listen [::]:8080 ipv6only=on;
    server_name report.soda.standupix.com;

    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl ipv6only=on;
    server_name report.soda.standupix.com;

    access_log off;

    ssl_certificate /opt/bitnami/nginx/certs/report.soda.standupix.com/fullchain.pem;
    ssl_certificate_key /opt/bitnami/nginx/certs/report.soda.standupix.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /i {
        if ($http_content_type = "text/ping") {
            return 404;
        }
        proxy_pass http://countly-api:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /i/ {
        if ($http_content_type = "text/ping") {
            return 404;
        }
        proxy_pass http://countly-api:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /o {
        if ($http_content_type = "text/ping") {
            return 404;
        }
        proxy_pass http://countly-api:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /o/ {
        if ($http_content_type = "text/ping") {
            return 404;
        }
        proxy_pass http://countly-api:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        if ($http_content_type = "text/ping") {
            return 404;
        }
        proxy_pass http://countly-frontend:6001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

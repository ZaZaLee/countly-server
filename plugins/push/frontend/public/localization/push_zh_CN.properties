# Error codes
push-notification.error-code.400.desc = 400 错误请求
push-notification.error-code.401.desc = 401 未授权。请确认你的推送通知凭据有效。
push-notification.error-code.403.desc = 403 未认证。请确认你的推送通知凭据有效。
push-notification.error-code.405.desc = 405 错误方法
push-notification.error-code.413.desc = 413 载荷过大。请减小通知载荷大小。
push-notification.error-code.429.desc = 429 请求过多。请稍后重试。
push-notification.error-code.500.desc = 500 服务器错误。请稍后重试。
push-notification.error-code.503.desc = 503 服务关闭。请稍后重试。
push-notification.error-code.Rejected.desc = 消息在发送过程中处于未激活状态。
push-notification.error-code.NoAudience.desc = 没有可发送此通知的用户。可能是该消息的筛选条件过于严格。
push-notification.error-code.NoApp.desc = 发送通知时未找到应用。
push-notification.error-code.NoMessage.desc = 发送通知时未找到消息。
push-notification.error-code.NoCredentials.desc = 发送通知时未找到推送通知凭据。
push-notification.error-code.NoConnection.desc = 连接推送服务提供商失败，请检查 Countly 主机是否可访问 APN / FCM / HPK。若使用代理服务器，请确认其运行正常。
push-notification.error-code.NoProxyConnection.desc = 使用代理服务器时连接推送服务提供商失败。请检查代理服务器设置。
push-notification.error-code.TooLateToSend.desc = Countly 未能及时发送这些通知（距计划发送时间已超过 1 小时）。
push-notification.error-code.ExpiredCreds.desc = 推送通知凭据可能已过期。请上传新的凭据。
push-notification.error-code.BadDeviceToken.desc = Countly Server 从你的应用接收到的推送令牌被 APNS 判定为无效。请确认 SDK 初始配置中的 `pushTestMode` 属性设置正确，同时确认配置描述文件（开发版或发布版）、Bundle ID 和 entitlements 设置无误。
push-notification.error-code.MissingTopic.desc = 服务器解析证书失败，请确认你使用的是通用证书；如已确认无误，请联系支持团队。
push-notification.error-code.DeviceTokenNotForTopic.desc = APNS 证书与应用的 Bundle ID 不匹配。
push-notification.error-code.TopicDisallowed.desc = 不允许向该主题发送推送通知。Apple 拒绝向此主题发送推送，很可能是因为在 Certificates、Identifiers & Profiles 门户中不存在对应应用。
push-notification.error-code.InvalidProviderToken.desc = 请检查 Auth key 文件、Team ID 和 Bundle ID，其中某项可能无效。
push-notification.error-code.MissingRegistration.desc = 请联系客户支持。
push-notification.error-code.InvalidRegistration.desc = 你可能修改了 SDK 处理 FCM token 的方式。请确认修改正确，或联系支持团队。
push-notification.error-code.InvalidParameters.desc = 请求参数无效。请将服务器日志发送给 Countly 支持团队。
push-notification.error-code.MismatchSenderId.desc = Sender ID 无效。很可能是你的应用中其他 Firebase SDK 与当前 SDK 在争抢 token。<br />请调整我们的 SDK 或其他 SDK 获取 token 的方式，确保它们最终使用同一个 token。
push-notification.error-code.MessageTooBig.desc = 消息过大，Google 拒绝投递。
push-notification.error-code.InvalidDataKey.desc = 消息包含无效的数据键，请检查：
push-notification.error-code.InvalidTtl.desc = 请联系客户支持。
push-notification.error-code.DeviceMessageRateExceeded.desc = 你向同一设备发送消息的频率超过了 Google 允许的限制，请适当降低频率。
push-notification.error-code.TopicsMessageRateExceeded.desc = 你向同一主题发送消息的频率超过了 Google 允许的限制，请适当降低频率。
push-notification.error-code.Unavailable.desc = Google 服务器意外返回 HTTP 200 Unavailable。请稍后重试。
push-notification.error-code.InternalServerError.desc = Google 服务器意外返回 HTTP 200 InternalServerError。请稍后重试。
push-notification.error-code.NotRegistered.desc = FCM token 已过期
push-notification.error-code.InvalidPackageName.desc = 你的应用包名与 FCM 中指定的包名不一致
push-notification.error-code.IllegalToken.desc = Huawei token 已过期或无效
push-notification.error-code.MessageBodyTooBig.desc = 消息体对 Huawei 通知而言过大
push-notification.error-code.TooManyTokens.desc = 发送给 Huawei 的 token 数量过多，请联系 Countly 支持团队。
push-notification.error-code.NotAuthorizedPriority.desc = 你无权发送高优先级 Huawei 通知。
push-notification.error-code.InternalHuaweiError.desc = Huawei 服务器内部错误。

push-notification.error-code.TooLateToSend.desc = Countly 未能及时发送这些通知（距计划发送时间已超过 1 小时）。
push-notification.error-code.del = 消息已删除
push-notification.error-code.del.desc = 推送通知消息因已被删除而从队列中丢弃。
push-notification.error-code.consent = 同意已取消
push-notification.error-code.consent.desc = 由于用户取消了推送同意，推送通知消息已从队列中移除。
push-notification.error-code.purge.desc = 由于用户数据已被清除，推送通知消息已从队列中移除。
push-notification.error-code.aborted = 已中止
push-notification.error-code.aborted.desc = 推送通知消息在发生不可恢复错误后已从队列中移除。请查看我们的 <a target="blank" class="el-link" href="https://support.count.ly/hc/en-us/articles/360037270012-Push-notifications#troubleshooting">故障排查</a> 文档。<br />如果你希望重新向未收到通知的用户发送该推送，请阅读以下 <a target="blank" class="el-link" href="https://support.count.ly/hc/en-us/articles/360037270012#resend-failed-notifications">说明</a>。
push-notification.error-code.ExpiredToken = Token 已过期
push-notification.error-code.ExpiredToken.desc = 受影响用户数量中的 token 已过期。


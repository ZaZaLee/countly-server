<div v-bind:class="[componentId]">
    <cly-header :title="i18n('retention.title')" :tooltip="{description: i18n('retention.description')}"></cly-header>
    <cly-main>
        <cly-section>
            <div class="bu-level" style="margin-bottom:16px;">
                <div class="bu-level-left">
                    <div class="bu-level-item">
                        <el-date-picker v-model="filters.from" type="date" value-format="yyyy-MM-dd" :placeholder="i18n('retention.filter.from')" @change="refresh"></el-date-picker>
                    </div>
                    <div class="bu-level-item">
                        <el-date-picker v-model="filters.to" type="date" value-format="yyyy-MM-dd" :placeholder="i18n('retention.filter.to')" @change="refresh"></el-date-picker>
                    </div>
                    <div class="bu-level-item">
                        <el-select v-model="filters.activityMode" @change="refresh" style="width:140px;">
                            <el-option :label="i18n('retention.activity.any-event')" value="any"></el-option>
                            <el-option :label="i18n('retention.activity.login-only')" value="login"></el-option>
                        </el-select>
                    </div>
                    <div class="bu-level-item">
                        <el-select v-model="filters.bucketType" @change="refresh" style="width:140px;">
                            <el-option :label="i18n('retention.bucket.5m')" value="5m"></el-option>
                            <el-option :label="i18n('retention.bucket.1h')" value="1h"></el-option>
                        </el-select>
                    </div>
                </div>
            </div>

            <div v-if="!hasRows && !isLoading" style="padding:24px; border:1px solid #eceff5; border-radius:4px; color:#52606d;">
                {{i18n('retention.empty-state')}}
            </div>
        </cly-section>

        <cly-section>
            <cly-chart-line :option="activityBucketChartOptions" :height="320" v-loading="isLoading" :force-loading="isLoading"></cly-chart-line>
            <cly-datatable-n :rows="activityBucketRows" :force-loading="isLoading">
                <template v-slot="scope">
                    <el-table-column :label="i18n('retention.table.bucket')">
                        <template slot-scope="scope">{{formatBucket(scope.row.bucket_start)}}</template>
                    </el-table-column>
                    <el-table-column prop="active_users" :label="i18n('retention.table.active-users')"></el-table-column>
                    <el-table-column prop="events" :label="i18n('retention.table.events')"></el-table-column>
                </template>
            </cly-datatable-n>
        </cly-section>

        <cly-section>
            <cly-chart-line :option="retentionChartOptions" :height="320" v-loading="isLoading" :force-loading="isLoading"></cly-chart-line>
            <cly-datatable-n :rows="retentionRows" :force-loading="isLoading">
                <template v-slot="scope">
                    <el-table-column prop="date" :label="i18n('retention.table.cohort-date')"></el-table-column>
                    <el-table-column prop="cohort_users" :label="i18n('retention.table.users')"></el-table-column>
                    <el-table-column prop="d1_rate" label="D1"></el-table-column>
                    <el-table-column prop="d2_rate" label="D2"></el-table-column>
                    <el-table-column prop="d3_rate" label="D3"></el-table-column>
                    <el-table-column prop="d7_rate" label="D7"></el-table-column>
                    <el-table-column prop="d14_rate" label="D14"></el-table-column>
                    <el-table-column prop="d30_rate" label="D30"></el-table-column>
                </template>
            </cly-datatable-n>
        </cly-section>
        <cly-section>
            <cly-chart-line :option="payerRetentionChartOptions" :height="320" v-loading="isLoading" :force-loading="isLoading"></cly-chart-line>
            <cly-datatable-n :rows="payerRetentionRows" :force-loading="isLoading">
                <template v-slot="scope">
                    <el-table-column prop="date" :label="i18n('retention.table.payer-active-cohort')"></el-table-column>
                    <el-table-column prop="cohort_users" :label="i18n('retention.table.payers')"></el-table-column>
                    <el-table-column prop="d1_rate" label="D1"></el-table-column>
                    <el-table-column prop="d2_rate" label="D2"></el-table-column>
                    <el-table-column prop="d3_rate" label="D3"></el-table-column>
                    <el-table-column prop="d7_rate" label="D7"></el-table-column>
                    <el-table-column prop="d14_rate" label="D14"></el-table-column>
                    <el-table-column prop="d30_rate" label="D30"></el-table-column>
                </template>
            </cly-datatable-n>
        </cly-section>
        <cly-section>
            <cly-chart-line :option="repeatPayRetentionChartOptions" :height="320" v-loading="isLoading" :force-loading="isLoading"></cly-chart-line>
            <cly-datatable-n :rows="repeatPayRetentionRows" :force-loading="isLoading">
                <template v-slot="scope">
                    <el-table-column prop="date" :label="i18n('retention.table.repeat-pay-cohort')"></el-table-column>
                    <el-table-column prop="cohort_users" :label="i18n('retention.table.payers')"></el-table-column>
                    <el-table-column prop="d1_rate" label="D1"></el-table-column>
                    <el-table-column prop="d2_rate" label="D2"></el-table-column>
                    <el-table-column prop="d3_rate" label="D3"></el-table-column>
                    <el-table-column prop="d7_rate" label="D7"></el-table-column>
                    <el-table-column prop="d14_rate" label="D14"></el-table-column>
                    <el-table-column prop="d30_rate" label="D30"></el-table-column>
                </template>
            </cly-datatable-n>
        </cly-section>
    </cly-main>
</div>
